name: Supported locked backport tests

env:
  # enable colored output
  PY_COLORS: 1

on:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "tests/**"
      - "uv.lock"
      - "pyproject.toml"
      - ".github/workflows/**"

  # run on all pull requests because these checks are required and will block merges otherwise
  pull_request:

  workflow_dispatch:

permissions:
  contents: read

jobs:
  run_tests:
    name: "Run supported locked tests: Python ${{ matrix.python-version }} on ${{ matrix.os }}"
    env:
      PY_COLORS: ${{ matrix.os == 'windows-latest' && '0' || '1' }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]
        include:
          - os: ubuntu-latest
            python-version: "3.13"
      fail-fast: false
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: ${{ matrix.python-version }}

      - name: Install supported locked backport dependencies
        # This backport validates the reviewed uv.lock; future-resolution failures remain recorded separately.
        run: uv sync --locked

      - name: Run tests (excluding integration and client_process)
        run: |
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            uv run --locked pytest -q --color=no --inline-snapshot=disable tests -m "not integration and not client_process"
          else
            uv run --locked pytest --inline-snapshot=disable tests -m "not integration and not client_process" --numprocesses auto --maxprocesses 4 --dist worksteal
          fi
        shell: bash

      - name: Run client process tests separately
        run: |
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            uv run --locked pytest -q --color=no --inline-snapshot=disable tests -m "client_process" -x
          else
            uv run --locked pytest --inline-snapshot=disable tests -m "client_process" -x
          fi
        shell: bash

  run_tests_lowest_direct:
    name: "Run supported locked dependencies"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.11"

      - name: Install supported locked backport dependencies
        # Preserve this complete test job using the supported reviewed lock.
        run: uv sync --locked

      - name: Run tests (excluding integration and client_process)
        run: uv run --locked pytest --inline-snapshot=disable tests -m "not integration and not client_process" --numprocesses auto --maxprocesses 4 --dist worksteal

      - name: Run client process tests separately
        run: uv run --locked pytest --inline-snapshot=disable tests -m "client_process" -x

  run_integration_tests:
    name: "Run integration tests"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.11"

      - name: Install supported locked backport dependencies
        # This backport validates the reviewed uv.lock; future-resolution failures remain recorded separately.
        run: uv sync --locked

      - name: Run integration tests
        # use longer per-test timeout for remote API calls (default is 5s)
        run: uv run --locked pytest tests -m "integration" --timeout=30 --numprocesses auto --maxprocesses 2 --dist worksteal
        env:
          FASTMCP_GITHUB_TOKEN: ${{ secrets.FASTMCP_GITHUB_TOKEN }}
          FASTMCP_TEST_AUTH_GITHUB_CLIENT_ID: ${{ secrets.FASTMCP_TEST_AUTH_GITHUB_CLIENT_ID }}
          FASTMCP_TEST_AUTH_GITHUB_CLIENT_SECRET: ${{ secrets.FASTMCP_TEST_AUTH_GITHUB_CLIENT_SECRET }}
